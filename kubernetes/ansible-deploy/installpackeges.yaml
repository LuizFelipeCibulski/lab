---
- name: Install a container runtime
  hosts: all
  become: true

  tasks:
    - name: atualizando
      ansible.builtin.apt:
        update_cache: true

    - name: Install 
      ansible.builtin.apt:
        pkg:
          - ca-certificates
          - curl
          - apt-transport-https
          - gpg

    - name: Add Docker key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        id: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
        state: present
      register: add_repository_key
      ignore_errors: true

    - name: Repo
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ansible_lsb.codename}} stable"
        update_cache: yes

    - name: Install 
      ansible.builtin.apt:
        pkg:
          - containerd.io

- name: Configure containerd
  hosts: all
  become: true

  tasks:
  - name: Comentario na linha disabled_plugins
    ansible.builtin.replace:
      path: /etc/containerd/config.toml
      regexp: '^([^#]*disabled_plugins.*)$'
      replace: '# \1'

  - name: Cgroup parameter
    ansible.builtin.blockinfile:
      path: /etc/containerd/config.toml
      marker: "# {mark} ANSIBLE MANAGED BLOCK - runc SystemdCgroup"
      block: |
        [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc]
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
            SystemdCgroup = true

  - name: Reiniciar containerd
    ansible.builtin.service:
      name: containerd
      state: restarted
    become: true

  - name: Download public signing key
    shell: |
      curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

  - name: Install
    shell: |
      echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list

  - name: Atualizando
    ansible.builtin.apt:
      update_cache: true

  - name: Install 
    ansible.builtin.apt:
      pkg:
        - kubelet
        - kubeadm
        - kubectl
      allow_change_held_packages: true

  - name: Ensure the service is enabled and running
    ansible.builtin.systemd_service:
      name: kubelet
      enabled: true
      state: started
    become: true
  
  

