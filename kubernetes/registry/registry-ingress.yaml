apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-ingress
  namespace: registry
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`rgstibursio.ip.odhserver.com`) #DNS privado, acesso somente via vpn ou local
      kind: Rule
      services:
        - name: registry-svc
          port: 5000
